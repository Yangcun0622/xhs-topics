<script>
const ITEMS = [{"fn": "post_gan_01.jpg", "cat": "产后", "sub": "干货", "title": "产后第一次打喷嚏别慌：3个居家小练习护住核心", "hook": "咳嗽大笑那一下有点控制不住，先别急着焦虑，核心是有办法慢慢找回来的。", "tips": ["先练呼吸：平躺手放肚子，吸气鼓肚、呼气收紧，每天3组。", "侧卧收腹：侧躺屈膝，轻轻往里收肚子再放松，顺着呼吸来。", "别一上来就卷腹，先把骨盆和呼吸调顺，打喷嚏时用手轻托一下。"], "tags": "#产后恢复 #新手妈妈 #核心训练 #居家练习", "body": "产后第一次打喷嚏别慌：3个居家小练习护住核心\n\n咳嗽大笑那一下有点控制不住，先别急着焦虑，核心是有办法慢慢找回来的。\n\n· 先练呼吸：平躺手放肚子，吸气鼓肚、呼气收紧，每天3组。\n· 侧卧收腹：侧躺屈膝，轻轻往里收肚子再放松，顺着呼吸来。\n· 别一上来就卷腹，先把骨盆和呼吸调顺，打喷嚏时用手轻托一下。\n\n#产后恢复 #新手妈妈 #核心训练 #居家练习"}, {"fn": "post_gan_02.jpg", "cat": "产后", "sub": "干货", "title": "假胯宽不是胖：一张侧身照教你看出骨盆位置", "hook": "大腿根外侧鼓出来一小块，很多人第一反应是减肥，其实可能是发力位置不对。", "tips": ["找一面墙侧身站，看髂前上棘和大腿根的连线方向。", "假胯宽多在股骨大转子外凸，臀部练对会比瘦更显腿长。", "少翘二郎腿，走路有意识用臀发力，比束腿带实在。"], "tags": "#假胯宽 #骨盆 #体态管理 #宝妈日常", "body": "假胯宽不是胖：一张侧身照教你看出骨盆位置\n\n大腿根外侧鼓出来一小块，很多人第一反应是减肥，其实可能是发力位置不对。\n\n· 找一面墙侧身站，看髂前上棘和大腿根的连线方向。\n· 假胯宽多在股骨大转子外凸，臀部练对会比瘦更显腿长。\n· 少翘二郎腿，走路有意识用臀发力，比束腿带实在。\n\n#假胯宽 #骨盆 #体态管理 #宝妈日常"}, {"fn": "post_gan_03.jpg", "cat": "产后", "sub": "干货", "title": "产后42天复查后，回家真正该练的是这4件事", "hook": "医院报告看完，回家才是真正接上的时候，别让复查变成终点。", "tips": ["腹横肌唤醒：呼吸收腹优先于任何卷腹。", "盆底放松再收紧，别憋气硬练。", "骨盆稳定靠臀桥类慢动作，不求多求稳。", "每天10分钟分两次，比一次猛练更稳。"], "tags": "#产后42天 #居家恢复 #新手妈妈", "body": "产后42天复查后，回家真正该练的是这4件事\n\n医院报告看完，回家才是真正接上的时候，别让复查变成终点。\n\n· 腹横肌唤醒：呼吸收腹优先于任何卷腹。\n· 盆底放松再收紧，别憋气硬练。\n· 骨盆稳定靠臀桥类慢动作，不求多求稳。\n· 每天10分钟分两次，比一次猛练更稳。\n\n#产后42天 #居家恢复 #新手妈妈"}, {"fn": "post_gan_04.jpg", "cat": "产后", "sub": "干货", "title": "妈妈腕不是矫情：抱娃姿势改2处手腕轻松一半", "hook": "桡骨那一块疼到拧不开瓶盖，真不是你娇气，是抱姿在反复磨它。", "tips": ["抱娃时让小臂和手腕一条线，别长期勾着腕托头。", "换边抱，别总用习惯手，给另一侧轮流放假。", "疼的时候先热敷再轻拉伸，别硬撑着抱一整天。"], "tags": "#妈妈腕 #抱娃姿势 #宝妈日常 #疼痛缓解", "body": "妈妈腕不是矫情：抱娃姿势改2处手腕轻松一半\n\n桡骨那一块疼到拧不开瓶盖，真不是你娇气，是抱姿在反复磨它。\n\n· 抱娃时让小臂和手腕一条线，别长期勾着腕托头。\n· 换边抱，别总用习惯手，给另一侧轮流放假。\n· 疼的时候先热敷再轻拉伸，别硬撑着抱一整天。\n\n#妈妈腕 #抱娃姿势 #宝妈日常 #疼痛缓解"}, {"fn": "post_gan_05.jpg", "cat": "产后", "sub": "干货", "title": "盆底肌在家怎么唤醒：凯格尔这样做才不白费", "hook": "凯格尔做了半天找不到发力感？多半是呼吸和收紧的顺序乱了。", "tips": ["排尿中途停一下找的是位置，别平时也憋着练。", "用呼气末端轻轻往里收，像电梯往上走再松开。", "每天分小段做，坐着喂奶也能顺手练几组。"], "tags": "#盆底肌 #凯格尔 #产后恢复 #居家练习", "body": "盆底肌在家怎么唤醒：凯格尔这样做才不白费\n\n凯格尔做了半天找不到发力感？多半是呼吸和收紧的顺序乱了。\n\n· 排尿中途停一下找的是位置，别平时也憋着练。\n· 用呼气末端轻轻往里收，像电梯往上走再松开。\n· 每天分小段做，坐着喂奶也能顺手练几组。\n\n#盆底肌 #凯格尔 #产后恢复 #居家练习"}, {"fn": "post_gan_06.jpg", "cat": "产后", "sub": "干货", "title": "产后脱发别乱补：先把这3件事做对", "hook": "掉发高峰期看着水池堵，先别慌着狂补，节奏比补品重要。", "tips": ["保证睡和吃的基础，蛋白质不够头发先遭殃。", "洗头水温别太烫，梳头从发尾往上梳。", "脱发多是激素回落的过渡，给它两三月时间。"], "tags": "#产后脱发 #宝妈日常 #新手妈妈", "body": "产后脱发别乱补：先把这3件事做对\n\n掉发高峰期看着水池堵，先别慌着狂补，节奏比补品重要。\n\n· 保证睡和吃的基础，蛋白质不够头发先遭殃。\n· 洗头水温别太烫，梳头从发尾往上梳。\n· 脱发多是激素回落的过渡，给它两三月时间。\n\n#产后脱发 #宝妈日常 #新手妈妈"}, {"fn": "post_gan_07.jpg", "cat": "产后", "sub": "干货", "title": "肚子松和胖是两回事：自测腰部空心感的小方法", "hook": "体重掉了肚子还松垮垮？可能是腹部中间那条缝还没合拢，不是单纯胖。", "tips": ["平躺抬头，看肚脐上方有没有一条往里陷的缝。", "有空心感先练腹横肌，别急着疯狂卷腹。", "收腹先收呼吸，呼到底那一下肚子自然往里贴。"], "tags": "#肚子松弛 #产后恢复 #自测", "body": "肚子松和胖是两回事：自测腰部空心感的小方法\n\n体重掉了肚子还松垮垮？可能是腹部中间那条缝还没合拢，不是单纯胖。\n\n· 平躺抬头，看肚脐上方有没有一条往里陷的缝。\n· 有空心感先练腹横肌，别急着疯狂卷腹。\n· 收腹先收呼吸，呼到底那一下肚子自然往里贴。\n\n#肚子松弛 #产后恢复 #自测"}, {"fn": "post_gan_08.jpg", "cat": "产后", "sub": "干货", "title": "骨盆前倾自测：靠墙站看后腰能不能塞进拳头", "hook": "腰总是悬空、小腹往前顶，可能不是胖，是骨盆前倾在作怪。", "tips": ["靠墙站，后腰若能塞进一个拳头，留意前倾。", "久坐人群多见，先松髂腰肌再练臀腹。", "别长期塌腰坐，每小时起来站直伸个懒腰。"], "tags": "#骨盆前倾 #体态自测 #宝妈日常", "body": "骨盆前倾自测：靠墙站看后腰能不能塞进拳头\n\n腰总是悬空、小腹往前顶，可能不是胖，是骨盆前倾在作怪。\n\n· 靠墙站，后腰若能塞进一个拳头，留意前倾。\n· 久坐人群多见，先松髂腰肌再练臀腹。\n· 别长期塌腰坐，每小时起来站直伸个懒腰。\n\n#骨盆前倾 #体态自测 #宝妈日常"}, {"fn": "post_gan_09.jpg", "cat": "产后", "sub": "干货", "title": "产后第一次恢复运动，避开这5个坑", "hook": "急着动起来没错，但头几次最容易踩的坑，踩了反而拖慢进度。", "tips": ["别一上来卷腹和平板，核心没回来先伤腰。", "别憋气用力，呼吸顺了动作才有效。", "别跟风高强度课，哺乳期身体还在恢复期。", "别和孕前数字比，恢复看自己节奏。"], "tags": "#产后运动 #避坑 #新手妈妈 #恢复", "body": "产后第一次恢复运动，避开这5个坑\n\n急着动起来没错，但头几次最容易踩的坑，踩了反而拖慢进度。\n\n· 别一上来卷腹和平板，核心没回来先伤腰。\n· 别憋气用力，呼吸顺了动作才有效。\n· 别跟风高强度课，哺乳期身体还在恢复期。\n· 别和孕前数字比，恢复看自己节奏。\n\n#产后运动 #避坑 #新手妈妈 #恢复"}, {"fn": "post_gan_10.jpg", "cat": "产后", "sub": "干货", "title": "妊娠纹能不能淡：护理节奏比产品更重要", "hook": "纹路颜色会慢慢变浅这件事，拼的不是贵，是早和稳。", "tips": ["黄金期（产后数月）坚持润肤，比偶尔猛涂有用。", "控制体重别大起大落，皮肤少被拉扯。", "接受它变浅变淡，颜色淡了视觉上就轻很多。"], "tags": "#妊娠纹 #产后护理 #宝妈日常", "body": "妊娠纹能不能淡：   curList = ITEMS.filter(it =>
    (filter.cat==='all' || (it.cat===filter.cat && (filter.sub==='all' || it.sub===filter.sub))) &&
    (filter.status==='all' || (filter.status==='posted' && posted.has(it.fn)) || (filter.status==='unposted' && !posted.has(it.fn)))
  );
  grid.innerHTML = '';
  window.scrollTo({top:0});
  curList.forEach((it,i)=>{
    const d = document.createElement('div'); d.className='card';
    if(posted.has(it.fn)){ const bg=document.createElement('div'); bg.className='badge-posted'; bg.textContent='已发'; d.appendChild(bg); }
    const hd = document.createElement('div'); hd.className='head';
    const cp = document.createElement('span'); cp.className='chip ' + SUB_KEY[it.sub]; cp.textContent = it.cat + ' · ' + it.sub;
    const mb = document.createElement('button'); mb.className='markbtn' + (posted.has(it.fn)?' on':''); mb.textContent = posted.has(it.fn)?'已发':'标记已发';
    mb.onclick = (e)=>{ e.stopPropagation(); togglePosted(it.fn); };
    hd.appendChild(cp); hd.appendChild(mb);
    const ttl = document.createElement('div'); ttl.className='ttl'; ttl.textContent = it.title;
    const im = document.createElement('img'); im.className='cover'; im.src = it.fn; im.alt = it.title; im.onclick = ()=>openLB(i);
    const bd = document.createElement('div'); bd.className='body'; bd.textContent = shortBody(it.body);
    d.appendChild(hd); d.appendChild(ttl); d.appendChild(im); d.appendChild(bd);
    grid.appendChild(d);
  });
}
function openLB(i){
  cur = curList[i];
  document.getElementById('lbimg').src = cur.fn;
  document.getElementById('lbimg').alt = cur.title;
  lbMeta.textContent = '【' + cur.cat + '·' + cur.sub + '】' + cur.title + '\n\n' + cur.body;
  const bm = document.getElementById('btnMark');
  bm.className = 'btn-mark' + (posted.has(cur.fn)?' on':'');
  bm.textContent = posted.has(cur.fn)?'取消已发':'标记已发';
  document.getElementById('lb').classList.add('show');
}
function closeLB(){ document.getElementById('lb').classList.remove('show'); }
function togglePosted(fn){
  if(posted.has(fn)){ posted.delete(fn); toast('已取消「已发」'); } else { posted.add(fn); toast('已标记为已发'); }
  savePosted(posted);
  render(curFilter);
  if(cur){ const bm=document.getElementById('btnMark'); bm.className='btn-mark'+(posted.has(cur.fn)?' on':''); bm.textContent=posted.has(cur.fn)?'取消已发':'标记已发'; }
}
function toggleCur(){ if(cur){ togglePosted(cur.fn); } }
function copyTitle(){ copy(cur.title, '已复制标题'); }
function copyBody(){ copy('【' + cur.cat + '·' + cur.sub + '】' + cur.title + NL + NL + cur.body, '已复制文案'); }
function dlImg(){ const a=document.createElement('a'); a.href=cur.fn; a.download=cur.fn; a.click(); }
function copy(t, msg){ if(navigator.clipboard){ navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>fallback(t,msg)); } else { fallback(t,msg); } }
function fallback(t,msg){ const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); toast(msg); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
document.querySelectorAll('.nav-item').forEach(b=>{ b.onclick=()=>{ document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active')); b.classList.add('active'); render({cat:b.dataset.cat, sub:b.dataset.sub, status:b.dataset.status||'all'}); }; });
document.getElementById('lb').addEventListener('click', e=>{ if(e.target.id==='lb') closeLB(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });
render({cat:'all', sub:'all', status:'all'});
</script>
</body></html>
